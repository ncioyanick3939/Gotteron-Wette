<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gottéron Spielette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1118;--surface:#181c25;--card:#1f2430;--card-hover:#252b38;
  --border:#2a3040;--text:#e8e9ec;--muted:#7d8594;--accent:#e52535;
  --accent2:#ff3344;--green:#22c55e;--gold:#f5a623;--blue:#3b82f6;
  --input-bg:#141821;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.nav .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;letter-spacing:.3px}
.nav .logo .red{color:var(--accent)}
.nav .user-pill{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.nav .user-pill .name{color:var(--text);font-weight:600}
.nav .user-pill button{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer;font-family:inherit}
.nav .user-pill button:hover{border-color:var(--accent);color:var(--accent)}

/* OVERVIEW */
.overview{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:16px;background:var(--border);border-radius:12px;overflow:hidden}
.stat-card{background:var(--surface);padding:20px 16px;text-align:center}
.stat-card .figure{font-size:2.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat-card .figure .unit{font-size:1rem;font-weight:600;margin-left:3px;opacity:.7}
.stat-card.jackpot .figure{color:var(--accent2)}
.stat-card.bier .figure{color:var(--gold)}
.stat-card .caption{margin-top:6px;font-size:.78rem;color:var(--muted);font-weight:500}

/* SECTIONS */
.section{margin:20px 16px 8px}
.section-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

/* GAME CARD */
.game{background:var(--card);border:1px solid var(--border);border-radius:10px;margin:0 16px 12px;overflow:hidden}
.game:hover{border-color:#3a4155}
.game-top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.game-info .matchup{font-weight:700;font-size:1rem}
.game-info .matchup .vs{color:var(--muted);font-weight:500;margin:0 5px}
.game-info .date{color:var(--muted);font-size:.78rem;margin-top:2px}
.game-pot{text-align:right}
.game-pot .amount{font-size:1.5rem;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums}
.game-pot .amount .unit{font-size:.8rem;font-weight:600}
.game-pot .label{font-size:.7rem;color:var(--muted);margin-top:1px}

.game-bets{border-top:1px solid var(--border);padding:0 16px}
.bet-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:.87rem}
.bet-row:last-child{border-bottom:none}
.bet-row .left{display:flex;align-items:center;gap:8px}
.bet-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0}
.bet-user{font-weight:600}
.bet-right{text-align:right}
.bet-pred{font-weight:600}
.bet-amount{color:var(--muted);font-size:.75rem}
.bet-row.winner{background:linear-gradient(90deg,rgba(245,166,35,.08),transparent);margin:0 -16px;padding:9px 16px;border-radius:0}
.bet-row.winner .bet-pred{color:var(--gold)}

.game-form{border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px}
.game-form input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.9rem;font-family:inherit}
.game-form input::placeholder{color:var(--muted)}
.game-form input:focus{outline:none;border-color:var(--accent)}
.game-form button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.game-form button:hover{background:var(--accent2)}

.game-empty{color:var(--muted);font-size:.82rem;padding:14px 16px;border-top:1px solid var(--border)}

/* ADMIN */
.admin-section{margin:0 16px 16px}
.admin-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.admin-row{display:flex;gap:8px}
.admin-card input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.9rem;font-family:inherit}
.admin-card input::placeholder{color:var(--muted)}
.admin-card button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit}

.close-picker{border-top:1px solid var(--border);padding:12px 16px}
.close-picker .hint{color:var(--muted);font-size:.75rem;margin-bottom:8px}
.close-picker label{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:4px 0;cursor:pointer}
.close-picker label input{accent-color:var(--accent)}
.close-actions{margin-top:10px}
.close-actions button{background:var(--gold);color:#1a1200;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit}

.status-closed{background:var(--border);color:var(--muted);padding:3px 10px;border-radius:6px;font-size:.72rem;font-weight:600}

.closed-summary{padding:10px 16px;border-top:1px dashed var(--border);font-size:.8rem;color:var(--muted);line-height:1.5}
.closed-summary b{color:var(--text);font-weight:600}

.empty{color:var(--muted);font-size:.88rem;text-align:center;padding:28px 16px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* AUTH OVERLAY */
.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{width:100%;max-width:380px}
.auth-header{text-align:center;margin-bottom:28px}
.auth-header .brand{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.auth-header .brand .red{color:var(--accent)}
.auth-header p{color:var(--muted);font-size:.88rem}

.auth-tabs{display:flex;margin-bottom:20px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.auth-tab{flex:1;padding:11px;text-align:center;font-weight:600;font-size:.9rem;cursor:pointer;background:var(--surface);color:var(--muted);border:none;font-family:inherit;transition:all .15s}
.auth-tab.active{background:var(--accent);color:#fff}

.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form input{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-size:.95rem;font-family:inherit}
.auth-form input::placeholder{color:var(--muted)}
.auth-form input:focus{outline:none;border-color:var(--accent)}
.auth-error{color:var(--accent);font-size:.82rem;text-align:center;min-height:1.2em}
.auth-form button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.auth-form button:hover{background:var(--accent2)}
.auth-form button:disabled{opacity:.5}
</style>
</head>
<body>

<nav class="nav" id="nav" style="display:none">
  <div class="logo">🏒 GOTTÉRON <span class="red">SPIELETTE</span></div>
  <div class="user-pill" id="user-pill">
    <span class="name" id="whoami-name"></span>
    <button id="logout-btn">Usloge</button>
  </div>
</nav>

<div class="overview" id="overview-wrap" style="display:none">
  <div class="stat-card jackpot">
    <div class="figure" id="jackpot-value">0<span class="unit">Fr.</span></div>
    <div class="caption">Jackpot · offeni Spiel</div>
  </div>
  <div class="stat-card bier">
    <div class="figure" id="konto-value">0<span class="unit">Fr.</span></div>
    <div class="caption">Bierkässeli 🍻</div>
  </div>
</div>

<div id="admin-new-game" style="display:none">
  <div class="section"><div class="section-title">Neus Spiel eröffne</div></div>
  <div class="admin-section">
    <div class="admin-card">
      <input type="text" id="ng-opponent" placeholder="Gägner, z.B. ZSC Lions">
      <div class="admin-row">
        <input type="date" id="ng-date">
        <button id="ng-create">Erstelle</button>
      </div>
    </div>
  </div>
</div>

<div class="section"><div class="section-title" id="open-title">Offeni Spiel</div></div>
<div id="open-games"><div class="empty">Lade…</div></div>

<div class="section" id="closed-section" style="display:none"><div class="section-title">Abgschlosseni Spiel</div></div>
<div id="closed-games"></div>

<div class="toast" id="toast"></div>

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <div class="auth-header">
      <div class="brand">🏒 GOTTÉRON <span class="red">SPIELETTE</span></div>
      <p>5 Franke pro Wett · Jackpot pro Spiel</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Iilogge</button>
      <button class="auth-tab" id="tab-register">Registriere</button>
    </div>
    <div class="auth-form" id="auth-form">
      <input type="text" id="login-name" placeholder="Dis Name" maxlength="30" autocomplete="name" style="display:none">
      <input type="email" id="login-email" placeholder="Email" maxlength="80" autocomplete="email">
      <input type="password" id="login-pass" placeholder="Passwort" maxlength="60" autocomplete="current-password">
      <div class="auth-error" id="login-error"></div>
      <button id="login-btn">Iilogge</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
